name: Build and Push Docker Image

on:
  pull_request:
  # Any base branch, not just main/master/develop. A stacked PR (wave N+1
  # targeting wave N) matched no filter here, so CI never ran on it: 22 of 24
  # open agent PRs and 18 of 19 dashboard PRs had never been built, vetted,
  # linted or tested by any machine, which made their lack of failures look
  # like a pass. GitHub resolves the workflow from a PR's merge commit, so this
  # takes effect for an existing PR once its head carries this change or it is
  # retargeted onto main.
    branches: ['**']
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
      - 'v*.*'
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opa-dashboard

jobs:
  checks:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata and prepare tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            VERSION=${VERSION#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_push=true" >> $GITHUB_OUTPUT
            {
              echo "${{ env.REGISTRY }}/thegrimmchester/${{ env.IMAGE_NAME }}:latest"
              echo "${{ env.REGISTRY }}/thegrimmchester/${{ env.IMAGE_NAME }}:$VERSION"
            } > tags.txt
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "version=$SHA" >> $GITHUB_OUTPUT
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "${{ env.REGISTRY }}/thegrimmchester/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}-$SHA" > tags.txt
          else
            SHA=$(echo ${{ github.sha }} | cut -c1-7)
            echo "version=$SHA" >> $GITHUB_OUTPUT
            echo "should_push=true" >> $GITHUB_OUTPUT
            {
              echo "${{ env.REGISTRY }}/thegrimmchester/${{ env.IMAGE_NAME }}:latest"
              echo "${{ env.REGISTRY }}/thegrimmchester/${{ env.IMAGE_NAME }}:sha-$SHA"
            } > tags.txt
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          cat tags.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.meta.outputs.should_push == 'true' }}
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

