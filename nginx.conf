server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers (applied to every response, including errors)
    # img-src allows data:/https images (used by rum-demo.html); scripts and
    # styles remain same-origin only (no 'unsafe-inline').
    # connect-src includes localhost orchestrator/perf-lab when VITE_* absolute URLs are used.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' http://127.0.0.1:8091 http://127.0.0.1:8092 http://localhost:8091 http://localhost:8092 ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Extracted services (more specific than /api/).
    # Docker DNS — resolve at request time so missing upstreams do not fail nginx boot,
    # and ipv6=off avoids broken AAAA-only connect attempts on some Docker networks.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared Orchestrator upstream. Set MUST live inside each location (same pattern as
    # perf-lab) so the resolver runs in request context. Prefer the compose service
    # name; container_name is a second DNS alias on the same network.
    # Never let these fall through to Agent — Agent returns 410 Gone for extracted routes.

    location /api/perf/ {
        set $opa_perf_upstream http://perf-lab:8092;
        proxy_pass $opa_perf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /api/scm {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /api/scm/ {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/ai {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /api/ai/ {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/agents {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /api/agents/ {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/connectors {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/security/profiles {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /api/security/profiles/ {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /api/security/runs {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /v1/scm {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
    }

    location /v1/scm/ {
        set $opa_orch_upstream http://orchestrator:8091;
        proxy_pass $opa_orch_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Trailing slash so this only matches real API calls (/api/*) and not
    # client routes that merely start with "api" (e.g. the /api-keys page),
    # which must fall through to the SPA below.
    location /api/ {
        set $opa_agent_upstream http://agent:8080;
        proxy_pass $opa_agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        set $opa_agent_ws http://agent:8082;
        proxy_pass $opa_agent_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
