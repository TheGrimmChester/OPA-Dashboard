server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers (applied to every response, including errors)
    # img-src allows data:/https images (used by rum-demo.html); scripts and
    # styles remain same-origin only (no 'unsafe-inline').
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker DNS — resolve at request time so missing upstreams do not fail nginx boot,
    # and ipv6=off avoids broken AAAA-only connect attempts on some Docker networks.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Co-deployed: same-origin bridge to OAM for browser login (family issuer).
    # Hub /api/auth/login may also proxy to OAM when PEER_OAM_URL is set; the SPA
    # prefers /oam-auth so CSP connect-src 'self' stays satisfied.
    location /oam-auth/ {
        set $oam_api_upstream http://oam-api:8090;
        rewrite ^/oam-auth/(.*)$ /$1 break;
        proxy_pass $oam_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dashboard talks only to OPA-Hub (compose service `hub`, image opa-hub).
    # Trailing slash so this only matches real API calls (/api/*) and not
    # client routes that merely start with "api" (e.g. the /api-keys page).
    location /api/ {
        set $opa_hub_upstream http://hub:8080;
        proxy_pass $opa_hub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        set $opa_hub_ws http://hub:8082;
        proxy_pass $opa_hub_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
