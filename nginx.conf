server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security response headers (applied to every response, including errors)
    # img-src allows data:/https images (used by rum-demo.html); scripts and
    # styles remain same-origin only (no 'unsafe-inline').
    # connect-src includes localhost orchestrator/perf-lab when VITE_* absolute URLs are used.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self' http://127.0.0.1:8091 http://127.0.0.1:8092 http://localhost:8091 http://localhost:8092 ws: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Extracted services (more specific than /api/).
    # Docker DNS — resolve at request time so missing perf-lab does not fail nginx boot on NAS.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/perf/ {
        set $opa_perf_upstream http://perf-lab:8092;
        proxy_pass $opa_perf_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/scm/ {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ai/ {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/connectors {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/security/profiles {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/security/runs {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /v1/scm/ {
        proxy_pass http://orchestrator:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Trailing slash so this only matches real API calls (/api/*) and not
    # client routes that merely start with "api" (e.g. the /api-keys page),
    # which must fall through to the SPA below.
    location /api/ {
        proxy_pass http://agent:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://agent:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
