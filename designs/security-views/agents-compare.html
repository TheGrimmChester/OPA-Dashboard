<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPA · Agents Control — layout compare A / B / C</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0E14;
      --surface: #121722;
      --border: #2E3748;
      --text: #E6EAF2;
      --muted: #9AA6BC;
      --accent: #7C6CFF;
      --font: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(124,108,255,0.14), transparent 55%),
        radial-gradient(700px 380px at 90% 0%, rgba(76,169,255,0.08), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    header.compare-head {
      padding: 20px 24px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 640px; line-height: 1.4; }
    header a {
      color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500;
    }
    header a:hover { text-decoration: underline; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      padding: 12px 20px 28px;
    }
    .art {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .art figcaption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }
    .art figcaption span { color: var(--muted); font-weight: 500; }
    .frame-wrap {
      position: relative;
      height: min(78vh, 820px);
      overflow: hidden;
      background: #070A0F;
    }
    .frame-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 1440px;
      height: 920px;
      border: 0;
      transform-origin: 0 0;
      background: #0B0E14;
    }
    @media (max-width: 1200px) {
      .board { grid-template-columns: 1fr; }
      .frame-wrap { height: 640px; }
    }
  </style>
</head>
<body>
  <header class="compare-head">
    <div>
      <h1>Agents Control · layout compare</h1>
      <p>A capability cards · B jump + stack · C master–detail. Same prefs model as production AgentsTab. Open the interactive shell to edit prefs and switch layouts live.</p>
    </div>
    <a href="preview.html?pillar=control&section=agents&variant=a">Open interactive preview →</a>
  </header>
  <div class="board">
    <figure class="art">
      <figcaption>A · Cards <span>capability strip + 2×2</span></figcaption>
      <div className="frame-wrap" data-variant="a"><iframe title="Variant A" src="preview.html?pillar=control&section=agents&variant=a&embed=1"></iframe></div>
    </figure>
    <figure class="art">
      <figcaption>B · Jump <span>sticky chips + stack</span></figcaption>
      <div class="frame-wrap" data-variant="b"><iframe title="Variant B" src="preview.html?pillar=control&section=agents&variant=b&embed=1"></iframe></div>
    </figure>
    <figure class="art">
      <figcaption>C · Detail <span>domain rail + inspector</span></figcaption>
      <div class="frame-wrap" data-variant="c"><iframe title="Variant C" src="preview.html?pillar=control&section=agents&variant=c&embed=1"></iframe></div>
    </figure>
  </div>
  <script>
    function fitFrames() {
      document.querySelectorAll(".frame-wrap").forEach((wrap) => {
        const iframe = wrap.querySelector("iframe");
        const scale = Math.min(wrap.clientWidth / 1440, wrap.clientHeight / 920);
        iframe.style.transform = "scale(" + scale + ")";
      });
    }
    fitFrames();
    window.addEventListener("resize", fitFrames);
  </script>
</body>
</html>
