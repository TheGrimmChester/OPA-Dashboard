<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPA · Security SCM variant preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0B0E14;
      --bg-sunken: #070A0F;
      --surface-1: #121722;
      --surface-2: #1A2130;
      --surface-3: #232B3D;
      --border-subtle: #222A38;
      --border-default: #2E3748;
      --border-strong: #3C4759;
      --text-primary: #E6EAF2;
      --text-secondary: #9AA6BC;
      --text-muted: #66748C;
      --accent: #7C6CFF;
      --accent-hover: #8F80FF;
      --accent-subtle: rgba(124, 108, 255, 0.14);
      --accent-2: #17C0C0;
      --ok: #2FD98A; --ok-dim: rgba(47, 217, 138, 0.14);
      --warn: #F5C451; --warn-dim: rgba(245, 196, 81, 0.14);
      --error: #FF5C6C;
      --info: #4CA9FF; --info-dim: rgba(76, 169, 255, 0.14);
      --font-ui: "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 8px;
      --radius-sm: 5px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --rail-w: 200px;
      --topbar-h: 48px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .strong { font-weight: 600; }
    .small { font-size: 11px; }
    .muted, .rw-muted { color: var(--text-muted); }
    em { font-style: normal; color: var(--text-secondary); }

    /* —— Shell —— */
    .rw-shell {
      display: flex;
      width: 1320px;
      height: 900px;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      overflow: hidden;
      position: relative;
    }
    .rw-rail {
      width: var(--rail-w);
      flex: 0 0 var(--rail-w);
      background: var(--bg-sunken);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding-bottom: 12px;
    }
    .rw-rail-brand {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 600;
    }
    .rw-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 7px;
      background: linear-gradient(145deg, var(--accent), #4CA9FF);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .rw-rail-sec {
      padding: 14px 16px 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .rw-rail-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 8px;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      text-align: left;
    }
    .rw-rail-item:hover { background: var(--surface-2); color: var(--text-primary); }
    .rw-rail-item.active { background: var(--accent-subtle); color: var(--text-primary); }
    .rw-count {
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--surface-3);
      padding: 1px 6px;
      border-radius: 999px;
      color: var(--text-secondary);
    }
    .rw-rail-item.active .rw-count { background: rgba(124,108,255,0.28); color: #c8c0ff; }
    .rw-rail-foot {
      margin-top: auto;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .rw-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .rw-top {
      height: var(--topbar-h);
      flex: 0 0 var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(11,14,20,0.85);
      backdrop-filter: blur(8px);
    }
    .rw-crumb { color: var(--text-secondary); font-size: 12px; }
    .rw-crumb span { color: var(--text-muted); margin: 0 6px; }
    .rw-top-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; }
    .rw-page {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 20px;
      gap: 12px;
      overflow: hidden;
    }
    .rw-page-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex: 0 0 auto;
    }
    .rw-page-head h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .rw-page-head p {
      margin: 4px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
      max-width: 560px;
      line-height: 1.4;
    }
    .rw-page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* —— Controls —— */
    .rw-btn {
      border: 1px solid var(--border-default);
      background: var(--surface-2);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: background .15s var(--ease), border-color .15s;
    }
    .rw-btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .rw-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .rw-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .rw-btn.primary:hover { background: var(--accent-hover); }
    .rw-btn.sm { padding: 4px 8px; font-size: 11px; }
    .rw-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: var(--surface-3);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      text-transform: lowercase;
    }
    .rw-pill.ok { background: var(--ok-dim); color: var(--ok); border-color: transparent; }
    .rw-pill.warn { background: var(--warn-dim); color: var(--warn); border-color: transparent; }
    .rw-pill.info { background: var(--info-dim); color: var(--info); border-color: transparent; }
    .rw-switch {
      width: 36px; height: 20px;
      border-radius: 999px;
      border: 0;
      background: var(--surface-3);
      padding: 2px;
      position: relative;
      transition: background .18s var(--ease);
    }
    .rw-switch.on { background: var(--accent); }
    .rw-switch:disabled { opacity: 0.4; }
    .rw-switch-knob {
      display: block;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transform: translateX(0);
      transition: transform .18s var(--ease);
    }
    .rw-switch.on .rw-switch-knob { transform: translateX(16px); }
    .rw-pref {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .rw-pref-label { font-weight: 600; font-size: 12px; }
    .rw-pref-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.35; }
    .rw-pref-effect {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
    }
    .rw-pref-effect em { margin-right: 4px; color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .rw-pref-ctrl { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 80px; }
    .rw-pref-state { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
    .rw-pref-state.on { color: var(--ok); }
    .rw-check {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 10px;
      padding: 7px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
    }
    .rw-check:hover { background: var(--surface-2); }
    .rw-check.on { background: var(--accent-subtle); border-color: rgba(124,108,255,0.28); }
    .rw-check.disabled { opacity: 0.5; cursor: not-allowed; }
    .rw-check-label { display: block; font-weight: 500; font-size: 12px; }
    .rw-check-hint { display: block; font-size: 11px; color: var(--text-muted); line-height: 1.35; margin-top: 2px; }
    .rw-checks { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
    .rw-checks.compact .rw-check-hint { display: none; }
    .rw-checks-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 8px 0 4px;
    }
    .rw-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .rw-field.inline { flex-direction: row; align-items: center; gap: 8px; margin: 0; }
    .rw-field select, .rw-field input, .rw-textarea, select, input[type="number"], input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
    }
    .rw-textarea { width: 100%; resize: vertical; }
    .rw-field select:focus, .rw-field input:focus, .rw-textarea:focus, .rw-btn:focus-visible, .rw-switch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* —— Layout blocks —— */
    .rw-kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex: 0 0 auto;
    }
    .rw-kpi {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rw-kpi-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
    .rw-kpi-val { font-size: 22px; font-weight: 650; font-family: var(--font-mono); letter-spacing: -0.02em; }
    .rw-kpi-val.ok { color: var(--ok); }
    .rw-kpi-val.info { color: var(--info); }
    .rw-panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .rw-panel.flush .rw-table { border-top: 1px solid var(--border-subtle); }
    .rw-panel.grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .rw-panel.inspector { width: 360px; flex: 0 0 360px; display: flex; flex-direction: column; max-height: 100%; }
    .rw-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-2);
    }
    .rw-panel-head.tight { padding: 8px 10px; }
    .rw-panel-head h2, .rw-panel-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
    .rw-panel-body { padding: 12px; }
    .rw-panel-body.stack { display: flex; flex-direction: column; gap: 4px; overflow: auto; max-height: 520px; }
    .rw-lead { margin: 0 0 12px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
    .rw-row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rw-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rw-callout {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      line-height: 1.4;
    }
    .rw-callout.info { background: var(--info-dim); border-color: transparent; }
    .rw-callout strong { display: block; margin-bottom: 4px; }
    .rw-toast {
      position: absolute;
      right: 20px;
      bottom: 20px;
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      padding: 10px 14px;
      border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      z-index: 20;
      animation: rw-in .25s var(--ease);
    }
    @keyframes rw-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .rw-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rw-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg-sunken);
      border-bottom: 1px solid var(--border-subtle);
    }
    .rw-table td { padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .rw-table tr.selected, .rw-table tr:hover { background: var(--surface-2); }
    .rw-table tr[onclick], .rw-table tr.selected { cursor: pointer; }

    .rw-pick-row { display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 4px 0; }
    .rw-repo-pick { max-height: 160px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
    .rw-chip-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .rw-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--surface-2);
      font-size: 11px;
    }
    .rw-chip.on { background: var(--accent-subtle); border-color: rgba(124,108,255,0.35); }
    .rw-chip input { margin: 0; }
    .rw-pr-blocks { display: grid; gap: 8px; margin: 10px 0 12px; }
    .rw-pr-block { padding: 8px; background: var(--surface-2); border-radius: var(--radius-sm); }
    .rw-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* A — jump + scroll */
    .rw-jump {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 0 0 auto;
      padding: 4px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
    }
    .rw-jump button {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
    }
    .rw-jump button:hover { background: var(--surface-2); color: var(--text-primary); }
    .rw-jump button.active { background: var(--accent-subtle); color: var(--text-primary); }
    .rw-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 2px;
      scroll-behavior: smooth;
    }

    /* B — modes + split */
    .rw-conn-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      flex: 0 0 auto;
    }
    .rw-mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex: 0 0 auto;
    }
    .rw-mode-tabs button {
      text-align: left;
      border: 1px solid var(--border-subtle);
      background: var(--surface-1);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: border-color .15s, background .15s;
    }
    .rw-mode-tabs button strong { color: var(--text-primary); font-size: 13px; }
    .rw-mode-tabs button span { font-size: 11px; }
    .rw-mode-tabs button.active {
      background: var(--accent-subtle);
      border-color: rgba(124,108,255,0.4);
      color: var(--text-secondary);
    }
    .rw-split {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      overflow: hidden;
    }
    .rw-list { overflow: auto; flex: 1; }
    .rw-list-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--border-subtle);
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .rw-list-row:hover { background: var(--surface-2); }
    .rw-list-row.selected { background: var(--accent-subtle); box-shadow: inset 3px 0 0 var(--accent); }
    .rw-list-row.dim { opacity: 0.65; }
    .rw-list-badges { display: flex; gap: 4px; flex-shrink: 0; }
    .rw-catalog {
      border-top: 1px solid var(--border-subtle);
      max-height: 180px;
      overflow: auto;
      background: var(--bg-sunken);
      padding: 0 10px 8px;
    }
    .rw-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
      padding: 10px;
      background: var(--bg-sunken);
      border-radius: var(--radius-sm);
    }
    .rw-meta-grid span { display: block; font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .rw-run-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rw-run-card {
      padding: 10px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    /* C — stages + map */
    .rw-stage-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      overflow: hidden;
    }
    .rw-stages {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rw-stage {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 10px 10px;
      border: 1px solid var(--border-subtle);
      background: var(--surface-1);
      border-radius: var(--radius);
      color: var(--text-secondary);
      text-align: left;
    }
    .rw-stage.active {
      background: var(--accent-subtle);
      border-color: rgba(124,108,255,0.45);
      color: var(--text-primary);
    }
    .rw-stage-n {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent-2);
      letter-spacing: 0.04em;
    }
    .rw-stage-label { font-weight: 600; font-size: 12px; }
    .rw-stage-hint {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      padding: 0 2px;
    }
    .rw-stage-main {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rw-map-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .rw-map-title { margin: 0; font-size: 15px; }
    .rw-gate-map {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .rw-gate-card {
      position: relative;
      text-align: left;
      padding: 12px;
      min-height: 96px;
      border-radius: 12px;
      border: 1px solid var(--border-default);
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(124,108,255,0.12), transparent 55%),
        var(--surface-1);
      color: inherit;
      overflow: hidden;
      transition: transform .18s var(--ease), border-color .18s, box-shadow .18s;
    }
    .rw-gate-card:hover { transform: translateY(-1px); border-color: var(--border-strong); }
    .rw-gate-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(124,108,255,0.35), 0 10px 28px rgba(0,0,0,0.35);
    }
    .rw-gate-card.dormant { opacity: 0.72; filter: saturate(0.7); }
    .rw-gate-card.add {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-style: dashed;
      color: var(--text-muted);
      background: transparent;
    }
    .rw-plus { font-size: 22px; line-height: 1; color: var(--accent-2); }
    .rw-rings {
      position: absolute;
      right: -20px; top: -24px;
      width: 88px; height: 88px;
      pointer-events: none;
    }
    .rw-rings span {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--border-default);
      opacity: 0.5;
    }
    .rw-rings span:last-child { inset: 12px; }
    .rw-rings.on span:first-child { border-color: var(--ok); opacity: 0.85; }
    .rw-rings.block span:last-child { border-color: var(--warn); opacity: 0.9; }
    .rw-gate-body { position: relative; z-index: 1; }
    .rw-gate-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .rw-gate-tags span {
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--surface-3);
      color: var(--text-secondary);
    }
    .rw-gate-state { position: absolute; right: 10px; bottom: 10px; z-index: 1; }
    .rw-gate-inspector {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .rw-inspector-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.2fr 0.8fr;
      gap: 12px;
      padding: 12px;
    }
    .rw-inspector-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

    .rw-tray {
      position: absolute;
      left: calc(var(--rail-w) + 20px);
      right: 20px;
      bottom: 16px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      z-index: 15;
      animation: rw-in .22s var(--ease);
    }
    .rw-tray-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .rw-tray-body {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      padding: 12px 14px;
    }
    .rw-tray-repo { min-width: 140px; }

    /* —— Jobs —— */
    .rw-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .rw-dot.ok { background: var(--ok); }
    .rw-dot.warn { background: var(--warn); }
    .rw-dot.error { background: var(--error); }
    .rw-dot.info { background: var(--info); }
    .rw-dot.live { box-shadow: 0 0 0 0 rgba(245, 196, 81, 0.55); animation: rw-pulse 1.4s infinite; }
    @keyframes rw-pulse {
      70% { box-shadow: 0 0 0 8px rgba(245, 196, 81, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 196, 81, 0); }
    }
    .rw-jobs-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      flex: 0 0 auto;
    }
    .rw-sum-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-1);
      color: var(--text-secondary);
      font-size: 12px;
    }
    .rw-sum-chip strong { color: var(--text-primary); }
    .rw-sum-chip.active {
      background: var(--accent-subtle);
      border-color: rgba(124,108,255,0.4);
      color: var(--text-primary);
    }
    .rw-jobs-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      flex: 0 0 auto;
    }
    .rw-field.inline.grow { flex: 1 1 180px; }
    .rw-field.inline.grow input { width: 100%; min-width: 140px; }
    .rw-jobs-a {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 10px;
      overflow: hidden;
    }
    .rw-jobs-a.with-drawer .grow { min-width: 0; }
    .rw-kpi.clickable {
      cursor: pointer;
      text-align: left;
      border: 1px solid var(--border-subtle);
      transition: border-color .15s, background .15s;
    }
    .rw-kpi.clickable:hover { border-color: var(--border-strong); }
    .rw-kpi.clickable.active {
      background: var(--accent-subtle);
      border-color: rgba(124,108,255,0.45);
    }
    .rw-ev-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .rw-risk { margin: 8px 0; }
    .rw-risk-bar {
      height: 6px;
      border-radius: 99px;
      background: var(--bg-sunken);
      overflow: hidden;
      margin-top: 4px;
    }
    .rw-risk-bar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--warn), var(--error));
      border-radius: 99px;
    }
    .rw-child-list { display: flex; flex-direction: column; gap: 6px; }
    .rw-child-row {
      display: grid;
      grid-template-columns: 12px 72px auto 1fr;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .rw-finding {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
    }
    .rw-verdict {
      margin-top: 10px;
      padding: 10px;
      background: var(--bg-sunken);
      border-radius: var(--radius-sm);
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-secondary);
    }
    .rw-jobs-empty {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rw-swim {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      overflow: hidden;
    }
    .rw-lane {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .rw-lane-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface-2);
      font-size: 12px;
    }
    .rw-lane-body {
      flex: 1;
      overflow: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rw-lane-card {
      text-align: left;
      padding: 8px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--surface-2);
      color: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .rw-lane-card:hover { border-color: var(--border-strong); }
    .rw-lane-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(124,108,255,0.35);
    }
    .rw-child-pips { display: flex; gap: 3px; margin-top: 8px; }
    .rw-child-pips .pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border-strong);
    }
    .rw-child-pips .pip.ok { background: var(--ok); }
    .rw-child-pips .pip.warn { background: var(--warn); }
    .rw-child-pips .pip.error { background: var(--error); }
    .rw-child-pips .pip.info { background: var(--info); }

    /* Canvas page chrome */
    .explore-note {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 5;
      max-width: 320px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      font: 12px/1.4 var(--font-ui);
      color: #3a342c;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      pointer-events: none;
    }
  
  body { margin:0; background:#0B0E14; }
  .picker { position:fixed; top:10px; right:10px; z-index:50; display:flex; flex-direction:column; gap:6px; background:#1A2130; padding:8px; border-radius:8px; border:1px solid #2E3748; }
  .picker-row { display:flex; gap:6px; }
  .picker button { border:0; background:#121722; color:#E6EAF2; padding:6px 10px; border-radius:5px; cursor:pointer; font:12px IBM Plex Sans,sans-serif; }
  .picker button.active { background:#7C6CFF; }
  .frame { display:flex; justify-content:center; padding:56px 16px 24px; }
  .rw-shell { box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="jobs.jsx"></script>
  <script type="text/babel" src="variant-a.jsx"></script>
  <script type="text/babel" src="variant-b.jsx"></script>
  <script type="text/babel" src="variant-c.jsx"></script>
  <script type="text/babel">
    function Preview() {
      const params = new URLSearchParams(location.search);
      const [v, setV] = React.useState(params.get("v") || "b");
      const [tab, setTab] = React.useState(params.get("tab") || "jobs");
      React.useEffect(() => {
        const u = new URL(location.href);
        u.searchParams.set("v", v);
        u.searchParams.set("tab", tab);
        history.replaceState(null, "", u);
      }, [v, tab]);
      const View = v === "a" ? VariantA : v === "c" ? VariantC : VariantB;
      return (
        <>
          <div className="picker">
            <div className="picker-row">
              <button type="button" className={v==="a"?"active":""} onClick={() => setV("a")}>A Faithful</button>
              <button type="button" className={v==="b"?"active":""} onClick={() => setV("b")}>B Workspace</button>
              <button type="button" className={v==="c"?"active":""} onClick={() => setV("c")}>C Novel</button>
            </div>
            <div className="picker-row">
              <button type="button" className={tab==="watch"?"active":""} onClick={() => setTab("watch")}>Watch</button>
              <button type="button" className={tab==="jobs"?"active":""} onClick={() => setTab("jobs")}>PR Jobs</button>
            </div>
          </div>
          <div className="frame" key={v + "-" + tab}><View initialTab={tab} /></div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Preview />);
  </script>
</body>
</html>
