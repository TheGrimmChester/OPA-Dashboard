<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OPA · Repo Watch & PR Jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #0B0E14;
      --bg-sunken: #070A0F;
      --surface-1: #121722;
      --surface-2: #1A2130;
      --surface-3: #232B3D;
      --border-subtle: #222A38;
      --border-default: #2E3748;
      --border-strong: #3C4759;
      --text-primary: #E6EAF2;
      --text-secondary: #9AA6BC;
      --text-muted: #66748C;
      --text-disabled: #47526A;
      --accent: #7C6CFF;
      --accent-hover: #8F80FF;
      --accent-press: #6A59F0;
      --accent-subtle: rgba(124, 108, 255, 0.14);
      --accent-2: #17C0C0;
      --ok: #2FD98A; --ok-dim: rgba(47, 217, 138, 0.14);
      --warn: #F5C451; --warn-dim: rgba(245, 196, 81, 0.14);
      --error: #FF5C6C; --error-dim: rgba(255, 92, 108, 0.14);
      --info: #4CA9FF; --info-dim: rgba(76, 169, 255, 0.14);
      --font-ui: "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 8px;
      --radius-sm: 5px;
      --radius-lg: 12px;
      --shadow-pop: 0 12px 40px rgba(0, 0, 0, 0.45);
      --rail-w: 220px;
      --topbar-h: 52px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-ui);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select { font: inherit; color: inherit; }
    select, input[type="number"], input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, [role="button"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    a { color: var(--accent-hover); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .shell { display: flex; min-height: 100vh; }
    .rail {
      position: sticky; top: 0; height: 100vh;
      width: var(--rail-w); flex: 0 0 var(--rail-w);
      background: var(--bg-sunken);
      border-right: 1px solid var(--border-subtle);
      display: flex; flex-direction: column;
    }
    .rail-brand {
      height: var(--topbar-h);
      display: flex; align-items: center; gap: 10px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
    }
    .rail-brand .mark {
      width: 20px; height: 20px; border-radius: 6px;
      background: linear-gradient(145deg, var(--accent-hover), var(--accent-press));
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
    }
    .rail-scroll { flex: 1; overflow: auto; padding: 12px 0 16px; }
    .rail-group {
      padding: 14px 18px 6px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .rail-item {
      display: flex; align-items: center; gap: 10px;
      width: calc(100% - 16px);
      margin: 1px 8px; padding: 8px 12px;
      border: none; background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer; text-align: left;
      border-left: 2px solid transparent;
      transition: background .15s var(--ease), color .15s var(--ease);
    }
    .rail-item:hover { background: var(--surface-1); color: var(--text-primary); }
    .rail-item.active {
      background: var(--accent-subtle);
      color: var(--text-primary);
      border-left-color: var(--accent);
    }
    .rail-item .count {
      margin-left: auto;
      font-size: 11px; font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 1px 6px; border-radius: 999px;
    }
    .rail-item.active .count { background: rgba(124,108,255,0.22); color: var(--text-secondary); }
    .rail-foot {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px; color: var(--text-muted);
      display: flex; flex-direction: column; gap: 4px;
    }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--topbar-h);
      display: flex; align-items: center; gap: 16px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--bg-base) 86%, transparent);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 20;
    }
    .crumb {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-secondary); min-width: 0;
    }
    .crumb strong { color: var(--text-primary); font-weight: 600; }
    .crumb-sep { color: var(--text-disabled); }
    .topbar-meta {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--text-muted);
    }
    .org-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border-default);
      background: var(--surface-1);
      border-radius: 999px;
      color: var(--text-secondary);
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(47, 217, 138, 0.55);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(47, 217, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(47, 217, 138, 0); }
    }

    .content {
      padding: 24px 28px 40px;
      display: flex; flex-direction: column; gap: 20px;
      width: 100%;
      max-width: 1400px;
    }

    .page-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; flex-wrap: wrap;
    }
    .page-head h1 {
      margin: 0 0 6px;
      font-size: 24px; font-weight: 600; letter-spacing: -0.03em;
    }
    .page-sub {
      margin: 0; max-width: 58ch;
      font-size: 14px; line-height: 1.55; color: var(--text-secondary);
    }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    .kpi {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; flex-direction: column; gap: 6px;
      transition: border-color .15s var(--ease);
    }
    .kpi:hover { border-color: var(--border-default); }
    .kpi.clickable { cursor: pointer; text-align: left; width: 100%; }
    .kpi.active { border-color: color-mix(in srgb, var(--accent) 50%, var(--border-default)); background: var(--accent-subtle); }
    .kpi-label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .kpi-value {
      font-family: var(--font-mono);
      font-size: 26px; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .kpi-value.ok { color: var(--ok); }
    .kpi-value.warn { color: var(--warn); }
    .kpi-value.error { color: var(--error); }
    .kpi-value.info { color: var(--info); }
    .kpi-hint { font-size: 11px; color: var(--text-muted); }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px 14px;
      align-items: flex-end;
      padding: 12px 14px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
    }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label {
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted);
    }
    .field input, .field select {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      min-width: 140px;
      transition: border-color .15s var(--ease);
    }
    .field input:hover, .field select:hover { border-color: var(--border-strong); }
    .field input { min-width: 220px; }
    .field.grow { flex: 1 1 200px; }
    .toolbar-count {
      margin-left: auto; align-self: center;
      font-size: 12px; color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 500;
      border: 1px solid var(--border-default);
      background: var(--surface-2); color: var(--text-secondary);
      white-space: nowrap;
    }
    .pill.active { background: var(--accent-subtle); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text-primary); }
    .pill.ok { color: var(--ok); background: var(--ok-dim); border-color: transparent; }
    .pill.warn { color: var(--warn); background: var(--warn-dim); border-color: transparent; }
    .pill.error { color: var(--error); background: var(--error-dim); border-color: transparent; }
    .pill.info { color: var(--info); background: var(--info-dim); border-color: transparent; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border-default);
      background: var(--surface-2);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
    }
    .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn.ghost { background: transparent; }
    .btn.sm { padding: 5px 9px; font-size: 12px; }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      gap: 16px;
      align-items: start;
      min-height: 520px;
    }
    .panel {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-width: 0;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--surface-2) 80%, var(--surface-1));
    }
    .panel-title {
      margin: 0; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-body { padding: 16px 18px; }
    .panel-body.flush { padding: 0; }

    table.data {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    table.data th {
      text-align: left; padding: 10px 14px;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-muted);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-default);
      position: sticky; top: 0; z-index: 1;
    }
    table.data td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      vertical-align: middle;
    }
    table.data tbody tr {
      cursor: pointer;
      transition: background .12s var(--ease);
    }
    table.data tbody tr:hover td { background: var(--surface-3); color: var(--text-primary); }
    table.data tbody tr.selected td {
      background: var(--accent-subtle);
      color: var(--text-primary);
    }
    table.data tbody tr.selected td:first-child {
      box-shadow: inset 3px 0 0 var(--accent);
    }
    table.data .primary { color: var(--text-primary); font-weight: 500; }
    .status-cell {
      display: inline-flex; align-items: center; gap: 8px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto;
      background: var(--text-muted);
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.error { background: var(--error); }
    .dot.info { background: var(--info); }
    .dot.muted { background: var(--text-muted); }
    .dot.live {
      background: var(--warn);
      box-shadow: 0 0 0 0 rgba(245, 196, 81, 0.5);
      animation: pulse 1.6s ease-out infinite;
    }

    .preview-empty {
      min-height: 420px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; text-align: center; padding: 32px;
      color: var(--text-muted);
    }
    .preview-empty strong { color: var(--text-secondary); font-weight: 600; font-size: 14px; }

    .preview-head {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 16px;
    }
    .preview-title {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 16px; font-weight: 600; letter-spacing: -0.02em;
    }
    .meta-line {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-size: 12px; color: var(--text-muted);
    }
    .meta-line span strong { color: var(--text-secondary); font-weight: 500; }

    .chain { display: flex; flex-direction: column; gap: 0; }
    .step {
      display: grid; grid-template-columns: 28px 1fr; gap: 12px;
    }
    .step-rail { display: flex; flex-direction: column; align-items: center; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
      flex: 0 0 auto;
    }
    .step-num.done { background: var(--ok-dim); border-color: transparent; color: var(--ok); }
    .step-num.live { background: var(--warn-dim); border-color: transparent; color: var(--warn); }
    .step-num.fail { background: var(--error-dim); border-color: transparent; color: var(--error); }
    .step-line {
      width: 1px; flex: 1; min-height: 16px;
      background: var(--border-default); margin: 4px 0;
    }
    .step-card {
      background: var(--bg-sunken);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .step-card h3 {
      margin: 0; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px 14px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .meta-item > span:first-child {
      font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-muted); font-weight: 600;
    }
    .meta-item > span:last-child {
      font-size: 12px; color: var(--text-primary); overflow-wrap: anywhere;
    }

    .children { display: flex; flex-direction: column; }
    .child {
      display: grid;
      grid-template-columns: 88px 100px 1fr;
      gap: 8px; align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
    }
    .child:last-child { border-bottom: none; }
    .child .name { font-family: var(--font-mono); font-weight: 500; color: var(--text-primary); font-size: 11px; }

    .callout {
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      border: 1px solid var(--border-default);
      background: var(--surface-1);
      display: flex; flex-direction: column; gap: 4px;
    }
    .callout.info { background: var(--info-dim); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
    .callout.warn { background: var(--warn-dim); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .callout.ok { background: var(--ok-dim); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
    .callout.error { background: var(--error-dim); border-color: color-mix(in srgb, var(--error) 30%, transparent); }
    .callout-title { font-size: 12px; font-weight: 600; }
    .callout-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .finding {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: var(--bg-sunken);
      display: flex; flex-direction: column; gap: 6px;
    }
    .finding-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .finding-rule { font-size: 13px; font-weight: 600; }
    .finding-where { font-size: 11px; color: var(--text-muted); }
    .finding-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }

    .section { display: flex; flex-direction: column; gap: 10px; }
    .section h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .section-lead { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

    .gate-list { display: flex; flex-direction: column; }
    .gate-row {
      display: grid; grid-template-columns: 160px 1fr;
      gap: 14px; align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
    }
    .gate-row:last-child { border-bottom: none; }

    .stack-2 {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: start;
    }

    .timeline {
      display: flex; flex-direction: column; gap: 0;
    }
    .tl-item {
      display: grid; grid-template-columns: 72px 1fr;
      gap: 12px; padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-time { color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
    .tl-body { color: var(--text-secondary); line-height: 1.45; }
    .tl-body strong { color: var(--text-primary); font-weight: 500; }

    .risk-bar {
      height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden;
    }
    .risk-bar > span {
      display: block; height: 100%; border-radius: 999px;
      background: var(--warn);
    }

    .tweaks {
      position: fixed; right: 16px; bottom: 16px; z-index: 40;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    .tweaks-panel {
      width: 240px;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: var(--shadow-pop);
    }
    .tweaks-panel label {
      font-size: 12px; color: var(--text-secondary);
      display: flex; flex-direction: column; gap: 4px;
    }
    .tweaks-panel select {
      background: var(--surface-2);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
    }

    .muted { color: var(--text-muted); }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }

    .agent-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .agent-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .agent-card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--surface-2) 70%, transparent);
    }
    .agent-card-head h3 {
      margin: 0 0 4px; font-size: 14px; font-weight: 600;
    }
    .agent-card-head p {
      margin: 0; font-size: 12px; color: var(--text-muted); line-height: 1.45; max-width: 36ch;
    }
    .agent-card-body {
      padding: 6px 8px 10px;
      display: flex; flex-direction: column;
    }
    .pref-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 12px 10px;
      border-radius: var(--radius-sm);
      border-bottom: 1px solid var(--border-subtle);
    }
    .pref-row:last-child { border-bottom: none; }
    .pref-row:hover { background: var(--surface-2); }
    .pref-label { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-top: 2px; }
    .pref-label strong { font-size: 13px; font-weight: 500; }
    .pref-label .hint { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
    .pref-label .effect {
      font-size: 11px; color: var(--text-muted); line-height: 1.4;
      padding: 6px 8px; margin-top: 2px;

function relTime(iso) {
  if (!iso) return "—";
  const t = Date.parse(iso);
  const sec = Math.max(0, Math.round((NOW - t) / 1000));
  if (sec < 60) return `${sec}s ago`;
  if (sec < 3600) return `${Math.round(sec / 60)}m ago`;
  if (sec < 86400) return `${Math.round(sec / 3600)}h ago`;
  return `${Math.round(sec / 86400)}d ago`;
}

function fmtDur(sec) {
  if (sec == null) return "—";
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}m ${s.toString().padStart(2, "0")}s`;
}

function toneOf(status) {
  if (status === "completed") return "ok";
  if (status === "failed" || status === "blocked") return "error";
  if (status === "waiting" || status === "running" || status === "queued") return "warn";
  if (status === "skipped") return "info";
  return "muted";
}

function Pill({ children, tone, active }) {
  return <span className={["pill", tone || "", active ? "active" : ""].filter(Boolean).join(" ")}>{children}</span>;
}

function Switch({ on, onChange, disabled, label }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={!!on}
      aria-label={label}
      className={`switch ${on ? "on" : ""}`}
      disabled={disabled}
      onClick={() => onChange?.(!on)}
    />
  );
}

function PrefRow({ label, hint, effectOn, effectOff, on, children }) {
  const effect = on == null ? null : on ? effectOn : effectOff;
  return (
    <div className="pref-row">
      <div className="pref-label">
        <strong>{label}</strong>
        {hint ? <span className="hint">{hint}</span> : null}
        {effect ? <div className="effect"><em>Now:</em> {effect}</div> : null}
      </div>
      <div className="pref-control">
        {on != null && (
          <span className={`pref-state ${on ? "on" : "off"}`}>{on ? "On" : "Off"}</span>
        )}
        {children}
      </div>
    </div>
  );
}

function CheckRow({ id, label, hint, checked, disabled, onChange }) {
  return (
    <label className={`check-row ${checked ? "on" : ""}`}>
      <input
        type="checkbox"
        checked={!!checked}
        disabled={disabled}
        onChange={(e) => onChange?.(e.target.checked)}
        aria-describedby={`${id}-hint`}
      />
      <span>
        <strong>{label}</strong>
        <span id={`${id}-hint`} className="hint">{hint}</span>
      </span>
    </label>
  );
}

function ActionRow({ title, hint, effect, children, disabled }) {
  return (
    <div className="action-row" style={disabled ? { opacity: 0.55 } : undefined}>
      <div>
        <strong>{title}</strong>
        <div className="hint">{hint}</div>
        {effect ? <div className="effect">{effect}</div> : null}
      </div>
      <div>{children}</div>
    </div>
  );
}

function TriSelect({ value, onChange, options }) {
  return (
    <select value={value ?? ""} onChange={(e) => onChange(e.target.value)} style={{ minWidth: 120 }}>
      {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

function Dot({ tone, live }) {
  return <span className={["dot", tone || "muted", live ? "live" : ""].filter(Boolean).join(" ")} />;
}

function StatusCell({ status, tone }) {
  const t = tone || toneOf(status);
  const live = status === "running" || status === "waiting";
  return (
    <span className="status-cell">
      <Dot tone={t} live={live} />
      {status}
    </span>
  );
}

function SevPill({ sev }) {
  const tone = sev === "critical" || sev === "high" ? "error" : sev === "medium" ? "warn" : "info";
  return <Pill tone={tone}>{sev}</Pill>;
}

function countsFrom(jobs) {
  return jobs.reduce(
    (acc, j) => {
      acc.total += 1;
      acc[j.status] = (acc[j.status] || 0) + 1;
      if (["running", "waiting", "queued"].includes(j.status)) acc.inflight += 1;
      return acc;
    },
    { total: 0, inflight: 0, completed: 0, failed: 0, cancelled: 0, skipped: 0, running: 0, waiting: 0, queued: 0 }
  );
}

function WatchView({ watched, setWatched, onOpenAgents }) {
  const [selectedRepo, setSelectedRepo] = useState(watched.find((w) => w.enabled)?.repo || watched[0]?.repo);
  const [dirty, setDirty] = useState(false);
  const [toast, setToast] = useState("");
  const selected = watched.find((w) => w.repo === selectedRepo) || watched[0];
  const prefs = mergePrefs(selected?.repo);

  const enabled = watched.filter((w) => w.enabled).length;
  const disabled = watched.filter((w) => !w.enabled).length;
  const jobs24h = watched.reduce((s, w) => s + w.jobs24h, 0);

  const patchSelected = (patch) => {
    setWatched((rows) => rows.map((r) => (r.repo === selected.repo ? { ...r, ...patch } : r)));
    setDirty(true);
  };

  const toggleCheck = (check) => {
    const has = selected.checks.includes(check);
    const next = has ? selected.checks.filter((c) => c !== check) : [...selected.checks, check];
    patchSelected({ checks: next });
  };

  const save = () => {
    setDirty(false);
    setToast(`Saved watch controls for ${selected.repo}`);
    setTimeout(() => setToast(""), 2200);
  };

  return (
    <>
      <div className="page-head">
        <div>
          <h1>Repo Watch</h1>
          <p className="page-sub">
            Per-repo gate and check controls. Agent behavior (Bugbot, Cloud, Approval) lives under Agents — linked from each repo.
          </p>
        </div>
        <div className="page-actions">
          <button className="btn" onClick={() => onOpenAgents(selected?.repo)}>Agents prefs</button>
          <button className="btn">Add repos</button>
          <button className="btn primary" disabled={!dirty} onClick={save}>Save watch set</button>
        </div>
      </div>

      <div className="kpi-row" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
        <div className="kpi"><span className="kpi-label">Watched & enabled</span><span className="kpi-value ok">{enabled}</span></div>
        <div className="kpi"><span className="kpi-label">Disabled</span><span className="kpi-value">{disabled}</span></div>
        <div className="kpi"><span className="kpi-label">Jobs 24h</span><span className="kpi-value info">{jobs24h}</span></div>
        <div className="kpi"><span className="kpi-label">AI blocking on</span><span className="kpi-value">{watched.filter((w) => w.aiBlocking && w.enabled).length}</span></div>
      </div>

      <div className="callout info">
        <div className="callout-title">Installed ≠ watched ≠ spend</div>
        <div className="callout-body">GitHub App install alone does not enqueue AI. Only Dashboard-watched and enabled repos create paid agent work; ignored deliveries still appear in Webhooks.</div>
      </div>

      <div className="drawer-split">
        <div className="panel">
          <div className="panel-head">
            <h2 className="panel-title">Watched repositories</h2>
            <span className="muted" style={{ fontSize: 12 }}>{watched.length} repos</span>
          </div>
          <div className="panel-body flush" style={{ maxHeight: 560, overflow: "auto" }}>
            <table className="data">
              <thead>
                <tr>
                  <th>Repo</th>
                  <th>Checks</th>
                  <th>AI block</th>
                  <th>Enabled</th>
                  <th>24h</th>
                </tr>
              </thead>
              <tbody>
                {watched.map((r) => (
                  <tr
                    key={r.repo}
                    role="button"
                    tabIndex={0}
                    className={r.repo === selectedRepo ? "selected" : ""}
                    onClick={() => setSelectedRepo(r.repo)}
                    onKeyDown={(e) => { if (e.key === "Enter") setSelectedRepo(r.repo); }}
                  >
                    <td>
                      <div className="primary">{r.repo}</div>
                      <div className="muted" style={{ fontSize: 11 }}>{r.org} / {r.project}</div>
                    </td>
                    <td className="mono" style={{ fontSize: 11 }}>{r.checks.join(" · ") || "—"}</td>
                    <td>{r.aiBlocking ? <Pill tone="ok">on</Pill> : <Pill>off</Pill>}</td>
                    <td>{r.enabled ? <Pill tone="ok">yes</Pill> : <Pill>no</Pill>}</td>
                    <td className="mono">{r.jobs24h}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="panel" style={{ position: "sticky", top: 68 }}>
          <div className="panel-head">
            <h2 className="panel-title">{selected?.repo || "Select a repo"}</h2>
            {dirty && <Pill tone="warn">unsaved</Pill>}
          </div>
          {selected && (
            <div className="panel-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <PrefRow
                label="Enabled"
                hint="Master gate for this repository. Controls whether GitHub PR webhooks create paid jobs."
                on={selected.enabled}
                effectOn="PR events enqueue jobs and agent children for this repo."
                effectOff="Webhooks are stored for audit only — no AI spend, no check runs."
              >
                <Switch label="Enabled" on={selected.enabled} onChange={(v) => patchSelected({ enabled: v })} />
              </PrefRow>
              <PrefRow
                label="AI blocking"
                hint="Whether a failing Bugbot/approval child fails the GitHub Check Run and blocks merge."
                on={selected.aiBlocking}
                effectOn="OPA Review check fails when AI or approval blocks the PR."
                effectOff="Findings stay advisory — gate can still pass independently."
              >
                <Switch label="AI blocking" on={selected.aiBlocking} onChange={(v) => patchSelected({ aiBlocking: v })} disabled={!selected.enabled} />
              </PrefRow>
              <PrefRow
                label="Auto-request reviewer"
                hint="Ask GitHub to request the OPA Review bot as a reviewer when a PR opens."
                on={selected.autoReviewer}
                effectOn="Bot is requested on open/reopen so humans see it in the reviewers list."
                effectOff="Reviews still run via checks/comments — no reviewer request."
              >
                <Switch label="Auto-request reviewer" on={selected.autoReviewer} onChange={(v) => patchSelected({ autoReviewer: v })} disabled={!selected.enabled} />
              </PrefRow>
              <PrefRow
                label="Min approve score"
                hint="Lowest risk-adjusted score that auto-approval may grant without a human."
              >
                <input
                  type="number"
                  min={0}
                  max={100}
                  value={selected.minApproveScore}
                  onChange={(e) => patchSelected({ minApproveScore: Number(e.target.value) })}
                  style={{ width: 72 }}
                  disabled={!selected.enabled}
                />
              </PrefRow>
              <div className="effect" style={{ margin: "0 10px 8px", fontSize: 11, color: "var(--text-muted)" }}>
                Scores below <span className="mono">{selected.minApproveScore}</span> keep the approval child in <em>waiting</em> / blocked.
              </div>

              <div>
                <div className="muted" style={{ fontSize: 10, fontWeight: 600, letterSpacing: ".06em", textTransform: "uppercase", margin: "4px 10px 8px" }}>
                  Checks included in each PR job
                </div>
                <div className="check-list">
                  {CHECK_OPTS.map((c) => (
                    <CheckRow
                      key={c}
                      id={`chk-${c}`}
                      label={CHECK_INFO[c].label}
                      hint={CHECK_INFO[c].hint}
                      checked={selected.checks.includes(c)}
                      disabled={!selected.enabled}
                      onChange={() => toggleCheck(c)}
                    />
                  ))}
                </div>
              </div>

              <div className="callout" style={{ marginTop: 4 }}>
                <div className="callout-title">Effective agents</div>
                <div className="callout-body">
                  Bugbot <strong>{prefs.trigger_mode}</strong> · units {prefs.bugbot_max_units} · Cloud{" "}
                  <strong>{prefs.cloud_enabled ? prefs.autofix_mode : "off"}</strong> · Approval{" "}
                  <strong>{prefs.auto_approve ? "auto" : "manual"}</strong>
                </div>
                <div className="row" style={{ marginTop: 8 }}>
                  <button className="btn sm" onClick={() => onOpenAgents(selected.repo)}>Edit agent prefs</button>
                  <button className="btn sm ghost">Simulate PR</button>
                </div>
              </div>

              <div className="meta-grid">
                <div className="meta-item"><span>Last job</span><span>{relTime(selected.lastJobAt)}</span></div>
                <div className="meta-item"><span>Jobs 24h</span><span className="mono">{selected.jobs24h}</span></div>
              </div>
            </div>
          )}
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </>
  );
}

function AgentsView({ watched, initialRepo, onToast }) {
  const [level, setLevel] = useState("repo");
  const [repo, setRepo] = useState(initialRepo || watched.find((w) => w.enabled)?.repo || "");
  const [prefs, setPrefs] = useState(() => mergePrefs(initialRepo || watched.find((w) => w.enabled)?.repo || ""));
  const [showEffective, setShowEffective] = useState(false);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    if (initialRepo) {
      setRepo(initialRepo);
      setLevel("repo");
      setPrefs(mergePrefs(initialRepo));
      setDirty(false);
    }
  }, [initialRepo]);

  useEffect(() => {
    if (level === "repo" && repo) setPrefs(mergePrefs(repo));
    if (level === "org" || level === "installation") setPrefs({ ...DEFAULT_AGENT_PREFS });
    setDirty(false);
  }, [level, repo]);

  const setField = (key, value) => {
    setPrefs((p) => ({ ...p, [key]: value }));
    setDirty(true);
  };

  const save = () => {
    if (level === "repo" && repo) {
      REPO_PREF_OVERRIDES[repo] = {
        ...(REPO_PREF_OVERRIDES[repo] || {}),
        ...prefs,
      };
    }
    setDirty(false);
    onToast?.(`Saved ${level} agent prefs${level === "repo" ? ` · ${repo}` : ""}`);
  };

  const triggerOpts = [
    { value: "every_push", label: "Every push" },
    { value: "pr_open", label: "PR open" },
    { value: "on_demand", label: "On demand" },
    { value: "cron", label: "Cron" },

    { value: "suggest", label: "Suggest" },
    { value: "branch", label: "Branch" },

    { value: "medium", label: "Medium" },

            <PrefRow
              label="Checkup enabled"
              hint="Allow AI-planned repository health tests (separate from PR autofix)."
              on={prefs.checkup_enabled}
              effectOn="Checkup jobs can be scheduled for this scope."
              effectOff="No checkup planning runs."
            >
              <Switch label="Checkup enabled" on={prefs.checkup_enabled} onChange={(v) => setField("checkup_enabled", v)} />
            </PrefRow>
          </div>
        </section>
      </div>

      <div className="row">
        <button className="btn ghost sm" onClick={() => setShowEffective((v) => !v)}>
          {showEffective ? "Hide" : "Show"} effective prefs
        </button>
        <span className="muted" style={{ fontSize: 12 }}>
          Resolved for {level === "repo" ? (repo || "—") : level}
        </span>
      </div>

      {showEffective && (
        <div className="panel">
          <div className="panel-body flush" style={{ maxHeight: 280, overflow: "auto" }}>
            <table className="data">
              <thead>
                <tr><th>Field</th><th>Effective</th><th>Source</th></tr>
              </thead>
              <tbody>
                {Object.keys(prefs).sort().map((field) => {
                  const overridden = level === "repo" && repo && Object.prototype.hasOwnProperty.call(REPO_PREF_OVERRIDES[repo] || {}, field);
                  const val = prefs[field];
                  return (
                    <tr key={field} style={{ cursor: "default" }}>
                      <td className="mono" style={{ fontSize: 11 }}>{field}</td>
                      <td className="mono" style={{ fontSize: 11 }}>{typeof val === "boolean" ? (val ? "On" : "Off") : String(val)}</td>
                      <td><Pill>{overridden ? "repo" : level === "org" ? "org" : "builtin"}</Pill></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </>
  );
}

function WebhooksView({ webhooks, onOpenJob }) {
  const [q, setQ] = useState("");
  const [outcome, setOutcome] = useState("all");
  const filtered = useMemo(() => {
    return webhooks.filter((w) => {
      if (outcome !== "all" && w.outcome !== outcome) return false;
      if (q) {
        const hay = `${w.id} ${w.event} ${w.repo} ${w.honesty} ${w.jobId || ""}`.toLowerCase();
        if (!hay.includes(q.toLowerCase())) return false;
      }
      return true;
    });
  }, [webhooks, q, outcome]);

  const outcomeTone = (o) => {
    if (o === "enqueued") return "ok";
    if (o === "ignored" || o === "rejected") return "info";
    if (o === "cancelled" || o === "cancelled_inflight") return "muted";
    return undefined;
  };

  return (
    <>
      <div className="page-head">
        <div>
          <h1>Webhooks</h1>
          <p className="page-sub">Delivery receipts with honesty — why a PR became a job, or why it did not.</p>
        </div>
      </div>

      <div className="kpi-row" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
        <div className="kpi"><span className="kpi-label">Deliveries</span><span className="kpi-value">{webhooks.length}</span></div>
        <div className="kpi"><span className="kpi-label">Enqueued</span><span className="kpi-value ok">{webhooks.filter((w) => w.outcome === "enqueued").length}</span></div>
        <div className="kpi"><span className="kpi-label">Ignored / rejected</span><span className="kpi-value info">{webhooks.filter((w) => w.outcome === "ignored" || w.outcome === "rejected").length}</span></div>
        <div className="kpi"><span className="kpi-label">Invalid sig</span><span className="kpi-value error">{webhooks.filter((w) => !w.sig).length}</span></div>
      </div>

      <div className="toolbar">
        <div className="field">
          <label>Outcome</label>
          <select value={outcome} onChange={(e) => setOutcome(e.target.value)}>
            <option value="all">All</option>
            <option value="enqueued">Enqueued</option>
            <option value="ignored">Ignored</option>
            <option value="cancelled">Cancelled</option>
            <option value="cancelled_inflight">Cancelled in-flight</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div className="field grow">
          <label>Search</label>
          <input placeholder="delivery, repo, honesty…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <span className="toolbar-count">{filtered.length}/{webhooks.length}</span>
      </div>

      <div className="panel">
        <div className="panel-body flush" style={{ maxHeight: 560, overflow: "auto" }}>
          <table className="data">
            <thead>
              <tr>
                <th>When</th>
                <th>Event</th>
                <th>Repo / PR</th>
                <th>Outcome</th>
                <th>Honesty</th>
                <th>Job</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((w) => (
                <tr
                  key={w.id}
                  role="button"
                  tabIndex={0}
                  onClick={() => w.jobId && onOpenJob(w.jobId)}
                  style={{ cursor: w.jobId ? "pointer" : "default" }}
                >
                  <td className="mono" style={{ fontSize: 12 }}>{relTime(w.at)}</td>
                  <td className="mono" style={{ fontSize: 11 }}>{w.event}</td>
                  <td>
                    <div className="primary">{w.repo} {w.pr ? <Pill>#{w.pr}</Pill> : null}</div>
                    <div className="mono muted" style={{ fontSize: 11 }}>{w.sha}</div>
                  </td>
                  <td>
                    <Pill tone={outcomeTone(w.outcome)}>{w.outcome}</Pill>
                    {!w.sig && <Pill tone="error">bad sig</Pill>}
                  </td>
                  <td style={{ maxWidth: 280, color: "var(--text-secondary)", fontSize: 12 }}>{w.honesty}</td>
                  <td className="mono" style={{ fontSize: 11 }}>{w.jobId || "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </>
  );
}

function App() {
  const [tab, setTab] = useState("jobs");
  const [selectedId, setSelectedId] = useState("scmjob-8f2a1c");
  const [filter, setFilter] = useState({ status: "all", repo: "all", q: "" });
  const [showTweaks, setShowTweaks] = useState(false);
  const [density, setDensity] = useState("comfortable");
  const [watched, setWatched] = useState(WATCHED_SEED);
  const [agentsRepo, setAgentsRepo] = useState("acme/checkout-api");
  const [toast, setToast] = useState("");

  const selected = JOBS.find((j) => j.id === selectedId) || JOBS[0];
  const counts = countsFrom(JOBS);
  const pad = density === "compact" ? { padding: "16px 18px", gap: 14 } : undefined;

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2200);
  };

  const openJob = (id) => {
    setSelectedId(id);
    setTab("evidence");
  };

  const openAgents = (repo) => {
    if (repo) setAgentsRepo(repo);
    setTab("agents");
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "/" && document.activeElement?.tagName !== "INPUT") {
        e.preventDefault();
        document.querySelector('input[placeholder*="job, repo"]')?.focus();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const crumb =
    tab === "watch" ? "Repo Watch"
      : tab === "webhooks" ? "Webhooks"
        : tab === "evidence" ? "Evidence"
          : tab === "agents" ? "Agents"
            : "PR Jobs";

  return (
    <div className="shell">
      <aside className="rail">
        <div className="rail-brand"><span className="mark" /><span>OPA</span></div>
        <div className="rail-scroll">
          <div className="rail-group">Security · SCM</div>
          <button className={`rail-item ${tab === "watch" ? "active" : ""}`} onClick={() => setTab("watch")}>
            Repo Watch <span className="count">{watched.filter((w) => w.enabled).length}</span>
          </button>
          <button className={`rail-item ${tab === "jobs" || tab === "evidence" ? "active" : ""}`} onClick={() => setTab("jobs")}>
            PR Jobs <span className="count">{counts.inflight}</span>
          </button>
          <button className={`rail-item ${tab === "agents" ? "active" : ""}`} onClick={() => setTab("agents")}>
            Agents
          </button>
          <button className={`rail-item ${tab === "webhooks" ? "active" : ""}`} onClick={() => setTab("webhooks")}>
            Webhooks <span className="count">{WEBHOOKS.length}</span>
          </button>
          <button className={`rail-item ${tab === "evidence" ? "active" : ""}`} onClick={() => setTab("evidence")}>
            Evidence
          </button>
        </div>
        <div className="rail-foot">
          <span>Sample design mock</span>
          <span className="mono">installation 88421</span>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <div className="crumb">
            <span>Security</span>
            <span className="crumb-sep">/</span>
            <strong>{crumb}</strong>
          </div>
          <div className="topbar-meta">
            <span className="org-chip"><span className="live-dot" /> acme-prod</span>
            <span>auto-refresh 4s</span>
          </div>
        </header>

        <div className="content" style={pad}>
          {tab === "jobs" && (
            <JobsView
              jobs={JOBS}
              selectedId={selectedId}
              onSelect={setSelectedId}
              onOpenFull={openJob}
              filter={filter}
              setFilter={setFilter}
            />
          )}
          {tab === "evidence" && <EvidenceFull job={selected} onBack={() => setTab("jobs")} />}
          {tab === "watch" && (
            <WatchView
              watched={watched}
              setWatched={setWatched}
              onOpenAgents={openAgents}
            />
          )}
          {tab === "agents" && (
            <AgentsView
              watched={watched}
              initialRepo={agentsRepo}
              onToast={showToast}
            />
          )}
          {tab === "webhooks" && <WebhooksView webhooks={WEBHOOKS} onOpenJob={openJob} />}
        </div>
      </div>

      <div className="tweaks">
        {showTweaks && (
          <div className="tweaks-panel">
            <strong style={{ fontSize: 12 }}>Tweaks</strong>
            <label>
              Density
              <select value={density} onChange={(e) => setDensity(e.target.value)}>
                <option value="comfortable">Comfortable</option>
                <option value="compact">Compact</option>
              </select>
            </label>
          </div>
        )}
        <button className="btn sm" onClick={() => setShowTweaks((v) => !v)}>
          {showTweaks ? "Hide tweaks" : "Tweaks"}
        </button>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
